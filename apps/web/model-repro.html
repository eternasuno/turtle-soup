<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地模型最小加载复现</title>
  </head>
  <body>
    <h1>本地模型最小加载复现</h1>
    <p>仅在一个 Worker 内直接调用 Transformers.js 4.3.1 加载 Laya fp16，不加载游戏，不执行推理。仅使用本站已有缓存，不下载模型。</p>
    <p>测试前关闭本站其他标签页。每次测试后终止 Worker，再测试另一后端。若页面自动刷新，先复制下方记录。</p>
    <button id="wasm" type="button">加载 WASM</button>
    <button id="webgpu" type="button">加载 WebGPU</button>
    <button id="stop" type="button">终止 Worker</button>
    <h2>本次／上次记录</h2>
    <pre id="log" style="white-space: pre-wrap; overflow-wrap: anywhere" aria-live="polite"></pre>
    <script type="module" src="/src/model-repro.ts"></script>
  </body>
</html>
